name: Backend Security & Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend-security-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/backend/**'

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.5.0
          
      - name: Install dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile
        
      - name: Run npm audit
        working-directory: services/backend
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
        
      - name: Run ESLint security rules
        working-directory: services/backend
        run: pnpm run lint
        
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.5.0
          
      - name: Install dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile
        
      - name: Run unit tests
        working-directory: services/backend
        run: pnpm run test:unit
        env:
          REDIS_HOST: localhost
          NODE_ENV: test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.5.0
          
      - name: Install dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile
        
      - name: Run integration tests
        working-directory: services/backend
        run: pnpm run test:integration
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.5.0
          
      - name: Install dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright browsers
        working-directory: services/backend
        run: pnpm exec playwright install --with-deps chromium
        
      - name: Run E2E tests
        working-directory: services/backend
        run: pnpm run test:e2e
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          CI: true
          
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: services/backend/playwright-report/
          retention-days: 30

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.5.0
          
      - name: Install dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile
        
      - name: Run tests with coverage
        working-directory: services/backend
        run: pnpm run test:coverage
        env:
          REDIS_HOST: localhost
          NODE_ENV: test
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: services/backend/coverage
          flags: backend
          name: backend-coverage
          
      - name: Check coverage threshold
        working-directory: services/backend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage below 80% threshold"
            exit 1
          fi

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.5.0
          
      - name: Install dependencies
        working-directory: services/backend
        run: pnpm install --frozen-lockfile
        
      - name: Run type check
        working-directory: services/backend
        run: pnpm run typecheck

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        working-directory: services/backend
        run: docker build -t chef-backend:test .
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'chef-backend:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [security-audit, unit-tests, integration-tests, e2e-tests, coverage, typecheck]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          
          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "Some tests failed"
            exit 1
          fi
