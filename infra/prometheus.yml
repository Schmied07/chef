# Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'chef-monitor'

# Scrape configs
scrape_configs:
  # Chef Backend API
  - job_name: 'chef-backend'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (optional - for system metrics)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # Redis Exporter (optional - for Redis metrics)
  # - job_name: 'redis-exporter'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
